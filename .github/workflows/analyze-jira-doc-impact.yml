name: Analyze Jira Doc Impact

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: Jira key, for example ABC-123
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Jira secrets
        shell: bash
        run: |
          test -n "$JIRA_BASE_URL"
          test -n "$JIRA_EMAIL"
          test -n "$JIRA_API_TOKEN"

      - name: Fetch Jira issue
        shell: bash
        run: |
          curl -sS \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/${{ inputs.jira_key }}" > jira-issue.json

          jq -r '.fields.summary // ""' jira-issue.json > jira-summary.txt
          jq -r '
            .fields.description.content // []
            | map(
                .content // []
                | map(.text // "")
                | join(" ")
              )
            | join(" ")
          ' jira-issue.json > jira-description.txt
          jq -r '.fields.components // [] | map(.name) | join(" ")' jira-issue.json > jira-components.txt
          jq -r '.fields.labels // [] | join(" ")' jira-issue.json > jira-labels.txt

      - name: Build search terms
        shell: bash
        run: |
          cat jira-summary.txt jira-description.txt jira-components.txt jira-labels.txt > jira-search-source.txt

          tr '[:upper:]' '[:lower:]' < jira-search-source.txt \
            | sed -E 's/[^a-z0-9]+/\n/g' \
            | sed '/^$/d' \
            | awk 'length($0) >= 4' \
            | sort -u \
            | head -n 20 > terms.txt

      - name: Find likely matching docs
        shell: bash
        run: |
          : > matches.txt

          echo "Scanning ref: $GITHUB_REF"
          find docs -type f \( -name "*.md" -o -name "toc.json" \) | sort > docs-files.txt

          while IFS= read -r term; do
            rg -i -l "$term" docs --glob "*.md" --glob "toc.json" >> matches.txt || true
            grep -i "$term" docs-files.txt >> matches.txt || true
          done < terms.txt

          SUMMARY=$(cat jira-summary.txt)
          if [ -n "$SUMMARY" ]; then
            rg -i -l "$SUMMARY" docs --glob "*.md" --glob "toc.json" >> matches.txt || true
          fi

          sort -u matches.txt > unique-matches.txt

      - name: Write analysis summary
        shell: bash
        run: |
          TOC_IMPACT="No"
          if grep -qx "docs/toc.json" unique-matches.txt 2>/dev/null; then
            TOC_IMPACT="Yes"
          fi

          {
            echo "# Jira Analysis"
            echo
            echo "- Jira key: \`${{ inputs.jira_key }}\`"
            echo "- Summary: $(cat jira-summary.txt)"
            echo "- TOC impact likely: $TOC_IMPACT"
            echo
            echo "## Search Terms"
            echo
            sed 's/^/- /' terms.txt
            echo
            echo "## Likely Affected Files"
            echo
            if [ -s unique-matches.txt ]; then
              sed 's/^/- /' unique-matches.txt
            else
              echo "- No matching docs found automatically"
            fi
            echo
            echo "## Navigation Impact"
            echo
            if [ "$TOC_IMPACT" = "Yes" ]; then
              echo "- Review \`docs/toc.json\` for new entries, renamed topics, moved topics, or section changes"
            else
              echo "- No direct TOC match found automatically, but confirm whether navigation still needs an update"
            fi
            echo
            echo "## Recommended Next Review"
            echo
            echo "- Confirm whether the matched files are truly in scope"
            echo "- Identify any net-new topics not captured by keyword matching"
            echo "- Decide whether the issue needs update, create, restructure, or deprecate actions"
            echo "- Capture any missing SME input before drafting"
          } > analysis-summary.md

          cat analysis-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-doc-analysis-${{ inputs.jira_key }}
          path: |
            jira-issue.json
            jira-summary.txt
            jira-description.txt
            jira-components.txt
            jira-labels.txt
            terms.txt
            docs-files.txt
            unique-matches.txt
            analysis-summary.md
