name: Docs PR Checks

on:
  pull_request:
    branches:
      - staging
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint Markdown
        run: npm run docs:lint

      - name: Spell check
        run: npm run docs:spell

      - name: Link check
        run: npm run docs:links

      - name: Build docs
        run: npm run docs:build
