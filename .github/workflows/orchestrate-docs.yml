name: Orchestrate Docs Workflow

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: Jira key, for example ABC-123
        required: true
        type: string
      jira_title:
        description: Jira title, for example Update authentication topic
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze Jira Doc Impact
    uses: ./.github/workflows/analyze-jira-doc-impact.yml
    with:
      jira_key: ${{ inputs.jira_key }}
    secrets: inherit

  create_branch:
    name: Create Docs Branch
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    uses: ./.github/workflows/create-docs-branch.yml
    with:
      jira_key: ${{ inputs.jira_key }}
      jira_title: ${{ inputs.jira_title }}
    secrets: inherit
