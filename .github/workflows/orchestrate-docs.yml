name: Orchestrate Docs Workflow

on:
  workflow_dispatch:
    inputs:
      jira_key:
        description: Jira key
        required: true
        type: string
      jira_title:
        description: Jira title
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    uses: ./.github/workflows/analyze-jira-doc-impact.yml
    with:
      jira_key: ${{ inputs.jira_key }}
    secrets: inherit

  create_branch:
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    uses: ./.github/workflows/create-docs-branch.yml
    with:
      jira_key: ${{ inputs.jira_key }}
      jira_title: ${{ inputs.jira_title }}
    secrets: inherit

  comment_jira:
    needs: create_branch
    if: ${{ needs.create_branch.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_KEY: ${{ inputs.jira_key }}
      BRANCH_NAME: ${{ needs.create_branch.outputs.branch_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add Jira comment
        shell: bash
        run: |
          BRANCH_URL="https://github.com/$REPO/tree/$BRANCH_NAME"

          cat > comment.json <<EOF
          {
            "body": {
              "type": "doc",
              "version": 1,
              "content": [
                {
                  "type": "paragraph",
                  "content": [
                    { "type": "text", "text": "Documentation branch created: " },
                    {
                      "type": "text",
                      "text": "$BRANCH_NAME",
                      "marks": [
                        {
                          "type": "link",
                          "attrs": { "href": "$BRANCH_URL" }
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          }
          EOF

          curl -sS \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -X POST \
            --data @comment.json \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/comment"
